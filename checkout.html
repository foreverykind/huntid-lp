<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuntID — Upgrade to Pro</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { text-align: center; padding: 24px; max-width: 360px; width: 100%; }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: #ff5500;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 28px; line-height: 1.5; }
    .plans { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .plan {
      border: 1.5px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px 18px;
      cursor: pointer;
      text-align: left;
      background: #161616;
      transition: border-color 160ms, background 160ms;
      position: relative;
    }
    .plan:hover { border-color: #ff5500; background: #1a1212; }
    .plan-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
    .plan-name { font-size: 14px; font-weight: 600; }
    .plan-badge {
      font-size: 10px; font-weight: 700;
      background: #ff5500; color: #fff;
      padding: 2px 7px; border-radius: 99px;
    }
    .plan-price { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    .plan-price span { font-size: 12px; font-weight: 400; color: #666; }
    .plan-note { font-size: 11px; color: #555; margin-top: 3px; }
    .hint { font-size: 12px; color: #444; }
    .err { font-size: 13px; color: #ff5500; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-icon">
        <svg width="14" height="14" viewBox="0 0 128 128" fill="none" aria-hidden="true">
          <circle cx="64" cy="64" r="34" stroke="#fff" stroke-width="8"/>
          <line x1="64" y1="14" x2="64" y2="34" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
          <line x1="64" y1="94" x2="64" y2="114" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
          <line x1="14" y1="64" x2="34" y2="64" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
          <line x1="94" y1="64" x2="114" y2="64" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
          <circle cx="64" cy="64" r="8" fill="#fff"/>
        </svg>
      </div>
      <span class="logo-name">HuntID</span>
    </div>

    <h1>Upgrade to Pro</h1>
    <p class="sub">Unlimited searches, save tracklists,<br>select favourite tracks and more to come.</p>

    <div class="plans" id="plans">
      <div class="plan" id="plan-annual" onclick="startCheckout('annual')">
        <div class="plan-header">
          <span class="plan-name">Annual</span>
          <span class="plan-badge" id="badge-annual">Save 33%</span>
        </div>
        <div class="plan-price"><span id="price-annual">$39.99</span> <span>/ year</span></div>
        <div class="plan-note" id="note-annual">≈ $3.33/month</div>
      </div>
      <div class="plan" id="plan-monthly" onclick="startCheckout('monthly')">
        <div class="plan-header">
          <span class="plan-name">Monthly</span>
        </div>
        <div class="plan-price"><span id="price-monthly">$4.99</span> <span>/ month</span></div>
        <div class="plan-note">Cancel anytime</div>
      </div>
    </div>

    <p class="hint">Resets never · this is not a trial</p>
    <p class="err" id="err" style="display:none"></p>
  </div>

  <script>
    // Price IDs stay hardcoded on purpose. They are stable — repricing edits the
    // amount on the existing Paddle price entity and never changes the ID — and
    // this page must be able to take money even if the pricing endpoint is down.
    // Amounts are the volatile half and are fetched below.
    var PRICE_MONTHLY = "pri_01kt9kehxvwehw4mw8mav4gkcc";
    var PRICE_ANNUAL  = "pri_01kw72fcy8gbe5aahzfb9n9hpk";

    Paddle.Initialize({
      token: "live_d9fbf05058c411bda68c0d571c8",
      eventCallback: function (data) {
        if (data.name === "checkout.completed") {
          window.location.href = "/payment-success.html?status=success";
        }
      }
    });

    // Displayed amounts come from get-pricing, which reads them off Paddle, so a
    // reprice needs no deploy here. The markup ships with the current amounts as
    // the fallback: if this fails the page shows those and still charges
    // correctly, since Paddle owns the real number at checkout either way.
    fetch("https://qhyebkofqjgzmmkpyalb.supabase.co/functions/v1/get-pricing")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (p) {
        if (!p || !p.monthly || !p.annual) return;
        document.getElementById("price-monthly").textContent = p.monthly.amount;
        document.getElementById("price-annual").textContent = p.annual.amount;
        document.getElementById("note-annual").textContent = "≈ " + p.annual.monthly_equivalent + "/month";
        var badge = document.getElementById("badge-annual");
        // Hide rather than show "Save 0%" if the two plans ever price flat.
        if (p.annual.save_percent > 0) {
          badge.textContent = "Save " + p.annual.save_percent + "%";
        } else {
          badge.style.display = "none";
        }
      })
      .catch(function () {});

    var params = new URLSearchParams(window.location.search);
    var userId = params.get("user_id");
    var email  = params.get("email");

    function showError(msg) {
      document.getElementById("plans").style.display = "none";
      var el = document.getElementById("err");
      el.style.display = "block";
      el.textContent = msg;
    }

    if (!userId) {
      showError("Invalid checkout link. Please try again from the extension.");
    }

    function startCheckout(plan) {
      if (!userId) return;
      var priceId = plan === "annual" ? PRICE_ANNUAL : PRICE_MONTHLY;
      Paddle.Checkout.open({
        items: [{ priceId: priceId, quantity: 1 }],
        customer: email ? { email: decodeURIComponent(email) } : undefined,
        customData: { user_id: userId },
        settings: {
          successUrl: "https://huntid.app/payment-success.html?status=success",
          displayMode: "overlay",
          theme: "dark",
        }
      });
    }
  </script>
</body>
</html>
